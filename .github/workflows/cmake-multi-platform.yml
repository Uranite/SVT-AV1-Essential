name: auto build

on:
  workflow_dispatch:
    branches: [ "master", "Essential-v3.1.0" ]
  push:
    branches: [ "master", "Essential-v3.1.0" ]
  pull_request:
    branches: [ "master", "Essential-v3.1.0" ]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows_Optimized_x86_64-v3",
              os: windows-2022,
              generators: "Ninja",
              msvc_arch: x64,
              c_compiler: clang,
              cpp_compiler: clang++,
              march: "x86-64-v3"
            }
          - {
              name: "Windows_Generic",
              os: windows-2022,
              generators: "Ninja",
              msvc_arch: x64,
              c_compiler: clang,
              cpp_compiler: clang++,
              march: "generic"
            }
          - {
              name: "Ubuntu_Optimized_x86_64-v3",
              os: ubuntu-latest,
              c_compiler: clang,
              cpp_compiler: clang++,
              march: "x86-64-v3"
            }
          - {
              name: "Ubuntu_Generic",
              os: ubuntu-latest,
              c_compiler: clang,
              cpp_compiler: clang++,
              march: "generic"
            }
          - {
              name: "MacOS_arm64",
              os: macos-latest,
              c_compiler: clang,
              cpp_compiler: clang++,
              osx_arch: arm64,
              march: "generic"
            }
    env:
      CMAKE_GENERATOR: "${{ matrix.config.generators }}"
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/setup-nasm@v1
    - name: Ubuntu/Mac OS X
      if: ${{ !contains( matrix.config.os, 'windows' ) }}
      run: |
        if [ "${{ matrix.config.march }}" = "generic" ]; then
          cmake --fresh -B svt_build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER=${{ matrix.config.cpp_compiler }}" "-DCMAKE_C_COMPILER=${{ matrix.config.c_compiler }}" -DBUILD_SHARED_LIBS=OFF -DSVT_AV1_LTO=ON -DBUILD_DEC=OFF -DREPRODUCIBLE_BUILDS=ON "-DCMAKE_OSX_ARCHITECTURES=${{ matrix.config.osx_arch }}"
        else
          cmake --fresh -B svt_build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER=${{ matrix.config.cpp_compiler }}" "-DCMAKE_C_COMPILER=${{ matrix.config.c_compiler }}" -DBUILD_SHARED_LIBS=OFF -DSVT_AV1_LTO=ON -DBUILD_DEC=OFF -DREPRODUCIBLE_BUILDS=ON "-DCMAKE_OSX_ARCHITECTURES=${{ matrix.config.osx_arch }}" "-DCMAKE_C_FLAGS_RELEASE=-march=${{ matrix.config.march }} -O3 -DNDEBUG" "-DCMAKE_CXX_FLAGS_RELEASE=-march=${{ matrix.config.march }} -O3 -DNDEBUG"
        fi
        cmake --build svt_build --config Release
      shell: bash
    - name: Windows build
      if: contains( matrix.config.os, 'windows' )
      run: |
        set CC=clang
        set CXX=clang++
        if "${{ matrix.config.march }}" == "generic" (
          cmake --fresh -B svt_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSVT_AV1_LTO=OFF -DENABLE_AVX512=OFF -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -flto" -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -flto" -DREPRODUCIBLE_BUILDS=ON
        ) else (
          cmake --fresh -B svt_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSVT_AV1_LTO=OFF -DENABLE_AVX512=ON -DCMAKE_C_FLAGS_RELEASE="-march=${{ matrix.config.march }} -O2 -DNDEBUG -flto" -DCMAKE_CXX_FLAGS_RELEASE="-march=${{ matrix.config.march }} -O2 -DNDEBUG -flto" -DREPRODUCIBLE_BUILDS=ON
        )
        ninja -C svt_build
      shell: cmd
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config.name }}
        path: Bin/Release/
        retention-days: 90

    - name: Get latest release
      if: github.event_name == 'push' && github.ref == 'refs/heads/Essential-v3.1.0'
      id: latest_release
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: |
          const release = await github.rest.repos.getLatestRelease({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          console.log('Latest release tag:', release.data.tag_name);
          return release.data.tag_name;

    - name: Upload binaries to existing release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.latest_release.outputs.result }}
        files: Bin/Release/*